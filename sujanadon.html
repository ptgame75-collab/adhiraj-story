<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Portrait Design</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #2c3e50, #4ca1af);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card-container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.18);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .canvas-frame {
      position: relative;
      border-radius: 15px;
      overflow: hidden;
      border: 4px solid #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .title {
      color: #fff;
      margin-top: 15px;
      font-size: 1.2rem;
      letter-spacing: 1px;
    }

    .btn-container {
      margin-top: 15px;
    }

    button {
      background: #ff7e5f;
      background: linear-gradient(to right, #ff7e5f, #feb47b);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="canvas-frame">
      <canvas id="portraitCanvas"></canvas>
    </div>
    <div class="title">आर्टिस्टिक पोर्ट्रेट डिजाइन</div>
    <div class="btn-container">
      <button onclick="toggleEffect()">Filter Effect फेर्नुहोस्</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('portraitCanvas');
    const ctx = canvas.getContext('2d');
    
    // फोटो लोड गर्ने
    const img = new Image();
    // यहाँ आफ्नो फोटोको Path वा URL राख्नुहोस्
    img.src = '21938_2.jpg'; 

    let currentEffect = 0;

    img.onload = function() {
      canvas.width = img.width;
      canvas.height = img.height;
      drawOriginal();
    };

    function drawOriginal() {
      ctx.filter = 'none';
      ctx.drawImage(img, 0, 0);
    }

    function toggleEffect() {
      currentEffect = (currentEffect + 1) % 3;
      
      if (currentEffect === 0) {
        drawOriginal();
      } else if (currentEffect === 1) {
        // Artistic Warm/Soft Glow Filter
        ctx.filter = 'contrast(110%) brightness(105%) sepia(20%)';
        ctx.drawImage(img, 0, 0);
      } else if (currentEffect === 2) {
        // Sketch / Vintage Portrait Effect
        ctx.filter = 'grayscale(100%) contrast(150%)';
        ctx.drawImage(img, 0, 0);
      }
    }
  </script>

</body>
</html>
