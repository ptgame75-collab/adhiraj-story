<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Axe Throw Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    .game-card {
      width: 100%;
      max-width: 340px;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .message-box {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: #ffda79;
    }

    /* १:१ (Square) फ्रेम */
    .game-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      background-color: #000000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    /* ब्याटल-एक्स हतियार */
    .stuck-knife {
      position: absolute;
      width: 130px;
      height: auto;
      pointer-events: none;
      filter: drop-shadow(4px 6px 10px rgba(0,0,0,0.85));
      z-index: 3;
      animation: knifeImpact 0.15s ease-out forwards, knifeShake 0.1s 0.15s ease-in-out;
    }

    @keyframes knifeImpact {
      0% {
        transform: scale(1.8) rotate(-35deg);
        opacity: 0.6;
      }
      100% {
        transform: scale(1) rotate(-35deg);
        opacity: 1;
      }
    }

    @keyframes knifeShake {
      0% { transform: rotate(-35deg) translateY(0); }
      50% { transform: rotate(-32deg) translateY(-3px); }
      100% { transform: rotate(-35deg) translateY(0); }
    }

    /* रगत अझै ढिला सुस्तरी फैलिने (३ सेकेन्ड एनिमेसन) */
    .blood-splatter {
      position: absolute;
      width: 65px;
      height: 65px;
      background: #7a0000;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      clip-path: polygon(
        50% 0%, 65% 20%, 85% 15%, 75% 40%, 100% 50%, 
        80% 65%, 90% 90%, 60% 75%, 45% 100%, 35% 70%, 
        10% 85%, 20% 55%, 0% 40%, 25% 25%, 15% 5%
      );
      animation: bloodSpread 3s ease-out forwards;
    }

    @keyframes bloodSpread {
      0% {
        transform: translate(-50%, -50%) scale(0.1);
        opacity: 0.1;
      }
      100% {
        transform: translate(-50%, -50%) scale(var(--final-scale, 1));
        opacity: 0.85;
      }
    }

    .blood-drop {
      position: absolute;
      background-color: #5c0000;
      border-radius: 40% 60% 70% 30% / 50% 60% 40% 50%;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: dropSpread 2.5s ease-out forwards;
    }

    @keyframes dropSpread {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 0.8;
      }
    }

    .reset-btn {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      background-color: #ff4757;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="message-box" id="messageArea">
      म्यासेज लेख्न बाँकी छ...
    </div>

    <div class="game-container" id="gameArea">
      <canvas id="photoCanvas"></canvas>
    </div>

    <button class="reset-btn" id="resetBtn">रिसेट गर्नुहोस् (Receive)</button>
  </div>

  <audio id="hitSound" src="knife-hit.mp3" preload="auto"></audio>

  <script>
    const canvas = document.getElementById('photoCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const gameArea = document.getElementById('gameArea');
    const hitSound = document.getElementById('hitSound');
    const resetBtn = document.getElementById('resetBtn');

    let attacks = [];
    const MAX_ATTACKS = 3;

    // फोटोको नाम मिलाइयो
    const img = new Image();
    img.src = '239.Png';

    img.onload = () => {
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      ctx.drawImage(img, 0, 0);
    };

    canvas.addEventListener('click', function(event) {
      const rect = canvas.getBoundingClientRect();
      
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      
      const canvasX = Math.floor((event.clientX - rect.left) * scaleX);
      const canvasY = Math.floor((event.clientY - rect.top) * scaleY);

      const pixel = ctx.getImageData(canvasX, canvasY, 1, 1).data;
      const alpha = pixel[3];
      const red = pixel[0], green = pixel[1], blue = pixel[2];

      const isBlackBackground = (red < 15 && green < 15 && blue < 15);

      if (alpha === 0 || isBlackBackground) {
        return;
      }

      const displayX = event.clientX - rect.left;
      const displayY = event.clientY - rect.top;

      hitSound.currentTime = 0;
      hitSound.play().catch(err => console.log("Audio play error:", err));

      if (attacks.length >= MAX_ATTACKS) {
        const oldestAttack = attacks.shift();
        oldestAttack.elements.forEach(el => el.remove());
      }

      const currentAttackElements = [];

      // १. बन्चरो
      const knife = document.createElement('img');
      knife.src = 'knife.png';
      knife.className = 'stuck-knife';
      knife.style.left = (displayX - 45) + 'px';
      knife.style.top = (displayY - 65) + 'px';
      gameArea.appendChild(knife);
      currentAttackElements.push(knife);

      // २. मुख्य रगत (सुस्तरी फैलिने)
      const blood = document.createElement('div');
      blood.className = 'blood-splatter';
      blood.style.left = displayX + 'px';
      blood.style.top = displayY + 'px';
      const randomScale = 0.8 + Math.random() * 0.5;
      blood.style.setProperty('--final-scale', randomScale);
      gameArea.appendChild(blood);
      currentAttackElements.push(blood);

      // ३. रगतका साना थोपाहरू
      for (let i = 0; i < 7; i++) {
        const drop = document.createElement('div');
        drop.className = 'blood-drop';
        const size = Math.random() * 7 + 3;
        drop.style.width = size + 'px';
        drop.style.height = size + 'px';
        
        const offsetX = (Math.random() - 0.5) * 60;
        const offsetY = (Math.random() - 0.5) * 60;
        
        drop.style.left = (displayX + offsetX) + 'px';
        drop.style.top = (displayY + offsetY) + 'px';
        drop.style.animationDelay = (Math.random() * 0.6) + 's';
        gameArea.appendChild(drop);
        currentAttackElements.push(drop);
      }

      attacks.push({ elements: currentAttackElements });
    });

    resetBtn.addEventListener('click', function() {
      attacks.forEach(attack => {
        attack.elements.forEach(el => el.remove());
      });
      attacks = [];
    });
  </script>

</body>
</html>
