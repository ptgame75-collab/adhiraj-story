<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knife Throw Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* मुख्य गेम कन्टेनर */
    .game-container {
      position: relative;
      width: 320px;
      height: 480px;
      border: 3px solid #ff4757;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
      background-color: #1e1e1e;
      cursor: pointer;
    }

    /* मुख्य फोटो (Target) */
    .target-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* गाडिने चक्कुको स्टाइल */
    .stuck-knife {
      position: absolute;
      width: 40px;
      height: auto;
      pointer-events: none;
      transform-origin: top center;
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.6));
      z-index: 2;
    }

    /* रगतको छिटा (Blood Splatter) */
    .blood-splatter {
      position: absolute;
      width: 30px;
      height: 30px;
      background: radial-gradient(circle, rgba(180,0,0,0.9) 0%, rgba(120,0,0,0.7) 50%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1;
      opacity: 0.9;
    }

    /* रगतका साना थोपाहरू */
    .blood-drop {
      position: absolute;
      background-color: #8b0000;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>

  <div class="game-container" id="gameArea">
    <!-- मुख्य फोटो -->
    <img src="238.Png" alt="Target Photo" class="target-img">
  </div>

  <!-- साउन्ड इफेक्ट -->
  <audio id="hitSound" src="knife-hit.mp3" preload="auto"></audio>

  <script>
    const gameArea = document.getElementById('gameArea');
    const hitSound = document.getElementById('hitSound');

    gameArea.addEventListener('click', function(event) {
      const rect = gameArea.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      // साउन्ड प्ले गर्ने
      hitSound.currentTime = 0;
      hitSound.play().catch(err => console.log("Audio play error:", err));

      // १. रगतको मुख्य छिटा (Blood Splatter) थप्ने
      const blood = document.createElement('div');
      blood.className = 'blood-splatter';
      blood.style.left = x + 'px';
      blood.style.top = y + 'px';
      
      // अलि र्‍यान्डम आकार दिन
      const randomScale = 0.8 + Math.random() * 0.6;
      blood.style.transform = `translate(-50%, -50%) scale(${randomScale})`;
      gameArea.appendChild(blood);

      // २. वरिपरी रगतका साना थोपाहरू थप्ने
      for (let i = 0; i < 5; i++) {
        const drop = document.createElement('div');
        drop.className = 'blood-drop';
        const size = Math.random() * 6 + 3; // ३ देखि ९px को आकार
        drop.style.width = size + 'px';
        drop.style.height = size + 'px';
        
        // चक्कु गाडिएको वरिपरि र्‍यान्डम पोजिसन
        const offsetX = (Math.random() - 0.5) * 35;
        const offsetY = (Math.random() - 0.5) * 35;
        
        drop.style.left = (x + offsetX) + 'px';
        drop.style.top = (y + offsetY) + 'px';
        gameArea.appendChild(drop);
      }

      // ३. नयाँ चक्कु थप्ने
      const knife = document.createElement('img');
      knife.src = 'knife.png';
      knife.className = 'stuck-knife';
      knife.style.left = (x - 20) + 'px';
      knife.style.top = y + 'px';

      gameArea.appendChild(knife);
    });
  </script>

</body>
</html>
