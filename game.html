<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knife Throw Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    .game-card {
      width: 100%;
      max-width: 340px;
      background-color: #1e1e1e;
      border: 2px solid #ff4757;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }

    .message-box {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background-color: #2a2a2a;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      color: #ffda79;
      border: 1px dashed #ff4757;
    }

    /* १:१ (Square) फोटो कन्टेनर */
    .game-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      background-color: #000;
    }

    .target-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ठूलो हतियार र एनिमेसन */
    .stuck-knife {
      position: absolute;
      width: 110px; /* हतियारको साइज ठूलो पारिएको */
      height: auto;
      pointer-events: none;
      filter: drop-shadow(3px 5px 8px rgba(0,0,0,0.8));
      z-index: 2;
      animation: knifeImpact 0.15s ease-out forwards, knifeShake 0.1s 0.15s ease-in-out;
    }

    /* हावाबाट उडेर गाडिने एनिमेसन */
    @keyframes knifeImpact {
      0% {
        transform: scale(2) rotate(-45deg);
        opacity: 0.5;
      }
      100% {
        transform: scale(1) rotate(-45deg);
        opacity: 1;
        clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
      }
    }

    /* गाडिएपछि थर्कने (Shake) एनिमेसन */
    @keyframes knifeShake {
      0% { transform: rotate(-45deg) translateY(0); }
      50% { transform: rotate(-42deg) translateY(-2px); }
      100% { transform: rotate(-45deg) translateY(0); }
    }

    /* रगतको छिटा */
    .blood-splatter {
      position: absolute;
      width: 48px;
      height: 48px;
      background: radial-gradient(circle, rgba(180,0,0,1) 0%, rgba(110,0,0,0.9) 60%, transparent 80%);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 3;
    }

    .blood-drop {
      position: absolute;
      background-color: #8b0000;
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
    }

    .reset-btn {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      background-color: #ff4757;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="message-box" id="messageArea">
      म्यासेज लेख्न बाँकी छ...
    </div>

    <div class="game-container" id="gameArea">
      <img src="238.Png" alt="Target Photo" class="target-img">
    </div>

    <button class="reset-btn" id="resetBtn">रिसेट गर्नुहोस् (Receive)</button>
  </div>

  <audio id="hitSound" src="knife-hit.mp3" preload="auto"></audio>

  <script>
    const gameArea = document.getElementById('gameArea');
    const hitSound = document.getElementById('hitSound');
    const resetBtn = document.getElementById('resetBtn');

    gameArea.addEventListener('click', function(event) {
      const rect = gameArea.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      hitSound.currentTime = 0;
      hitSound.play().catch(err => console.log("Audio play error:", err));

      // १. ठूलो हतियार थप्ने (एनिमेसन र शेकसहित)
      const knife = document.createElement('img');
      knife.src = 'knife.png';
      knife.className = 'stuck-knife knife-item';
      knife.style.left = (x - 38) + 'px';
      knife.style.top = (y - 50) + 'px';
      gameArea.appendChild(knife);

      // २. रगतको छिटा
      const blood = document.createElement('div');
      blood.className = 'blood-splatter blood-item';
      blood.style.left = x + 'px';
      blood.style.top = y + 'px';
      const randomScale = 0.9 + Math.random() * 0.5;
      blood.style.transform = `translate(-50%, -50%) scale(${randomScale})`;
      gameArea.appendChild(blood);

      // ३. रगतका थोपाहरू
      for (let i = 0; i < 6; i++) {
        const drop = document.createElement('div');
        drop.className = 'blood-drop blood-item';
        const size = Math.random() * 8 + 4;
        drop.style.width = size + 'px';
        drop.style.height = size + 'px';
        
        const offsetX = (Math.random() - 0.5) * 45;
        const offsetY = (Math.random() - 0.5) * 45;
        
        drop.style.left = (x + offsetX) + 'px';
        drop.style.top = (y + offsetY) + 'px';
        gameArea.appendChild(drop);
      }
    });

    resetBtn.addEventListener('click', function() {
      document.querySelectorAll('.knife-item').forEach(item => item.remove());
      document.querySelectorAll('.blood-item').forEach(item => item.remove());
    });
  </script>

</body>
</html>
