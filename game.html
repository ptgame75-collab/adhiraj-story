<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Axe Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    .game-card {
      width: 100%;
      max-width: 340px;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .message-box {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: #ffda79;
    }

    .game-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      overflow: hidden;
      background-color: #000000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
      border-radius: 8px;
    }

    /* ==========================================
       तपाईंको पुरानै स्टाइल (२६०px साइज मिलाइएको)
       ========================================== */
    .stuck-knife {
      position: absolute;
      width: 260px; /* बन्चरोको २६०px ठुलो साइज */
      height: auto;
      pointer-events: none;
      filter: drop-shadow(5px 8px 10px rgba(0, 0, 0, 0.8));
      z-index: 5;

      /* बन्चरोको मुख्य धारको कुना (Blade Edge Origin) */
      transform-origin: 12% 48%;

      left: var(--hit-x);
      top: var(--hit-y);

      animation: knifeImpact 0.12s ease-out forwards,
                 knifeShake 0.12s 0.12s ease-in-out;
    }

    @keyframes knifeImpact {
      0% {
        /* translate पहिले राख्दा बन्चरो जति ठुलो भए पनि धार ठ्याक्कै क्लिक पोइन्टमै रहन्छ */
        transform: translate(-12%, -48%) rotate(-35deg) scale(1.35);
        opacity: 0.5;
      }
      100% {
        transform: translate(-12%, -48%) rotate(-35deg) scale(1);
        opacity: 1;
      }
    }

    @keyframes knifeShake {
      0% {
        transform: translate(-12%, -48%) rotate(-35deg);
      }
      50% {
        transform: translate(-12%, -48%) rotate(-32deg);
      }
      100% {
        transform: translate(-12%, -48%) rotate(-35deg);
      }
    }

    /* पुरानै घाउको स्टाइल */
    .wound-mark {
      position: absolute;
      width: 40px;
      height: 12px;
      background: radial-gradient(ellipse at center, #3a0000 0%, #8b0000 60%, transparent 100%);
      border-radius: 50%;
      box-shadow: inset 0 0 5px #000;
      z-index: 2;
      transform: translate(-50%, -50%) rotate(-20deg);
      animation: woundAppear 0.1s ease-out forwards;
    }

    @keyframes woundAppear {
      0% { transform: translate(-50%, -50%) scale(0.2) rotate(-20deg); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1) rotate(-20deg); opacity: 1; }
    }

    /* पुरानै रगतको धारा */
    .blood-drip {
      position: absolute;
      width: 4px;
      background: linear-gradient(to bottom, #8b0000, #4a0000, transparent);
      border-radius: 2px;
      z-index: 3;
      transform-origin: top center;
      animation: dripAnim 2s ease-out forwards;
    }

    @keyframes dripAnim {
      0% { height: 0px; opacity: 1; }
      100% { height: var(--drip-height, 120px); opacity: 0.85; }
    }

    /* पुरानै रगतका छिटाहरू */
    .blood-splatter {
      position: absolute;
      background-color: #8b0000;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      animation: splatterAnim 0.2s ease-out forwards;
    }

    @keyframes splatterAnim {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 0.9; }
    }

    .reset-btn {
      margin-top: 25px;
      width: 100%;
      padding: 10px;
      background-color: #ff4757;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="message-box" id="messageArea">
      म्यासेज लेख्न बाँकी छ...
    </div>

    <div class="game-container" id="gameArea">
      <canvas id="photoCanvas"></canvas>
    </div>

    <button class="reset-btn" id="resetBtn">रिसेट गर्नुहोस् (Receive)</button>
  </div>

  <audio id="hitSound" src="knife-hit.mp3" preload="auto"></audio>

  <script>
    const canvas = document.getElementById('photoCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const gameArea = document.getElementById('gameArea');
    const hitSound = document.getElementById('hitSound');
    const resetBtn = document.getElementById('resetBtn');

    let attacks = [];
    const MAX_ATTACKS = 3;

    const bgImg = new Image();
    bgImg.src = '238.Png';

    const personImg = new Image();
    personImg.src = '239.Png';

    let imagesLoaded = 0;
    function checkLoaded() {
      imagesLoaded++;
      if (imagesLoaded === 2) {
        canvas.width = bgImg.naturalWidth || 500;
        canvas.height = bgImg.naturalHeight || 500;

        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        ctx.drawImage(personImg, 0, 0, canvas.width, canvas.height);
      }
    }

    bgImg.onload = checkLoaded;
    personImg.onload = checkLoaded;

    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

    personImg.onload = () => {
      offCanvas.width = personImg.naturalWidth;
      offCanvas.height = personImg.naturalHeight;
      offCtx.drawImage(personImg, 0, 0);
      checkLoaded();
    };

    canvas.addEventListener('click', function(event) {
      const rect = canvas.getBoundingClientRect();
      
      const scaleX = offCanvas.width / rect.width;
      const scaleY = offCanvas.height / rect.height;
      
      const canvasX = Math.floor((event.clientX - rect.left) * scaleX);
      const canvasY = Math.floor((event.clientY - rect.top) * scaleY);

      const pixel = offCtx.getImageData(canvasX, canvasY, 1, 1).data;
      const alpha = pixel[3]; 

      if (alpha < 20) {
        return; 
      }

      const displayX = event.clientX - rect.left;
      const displayY = event.clientY - rect.top;

      hitSound.currentTime = 0;
      hitSound.play().catch(err => console.log("Audio play error:", err));

      if (attacks.length >= MAX_ATTACKS) {
        const oldestAttack = attacks.shift();
        oldestAttack.elements.forEach(el => el.remove());
      }

      const currentAttackElements = [];

      // १. घाउ
      const wound = document.createElement('div');
      wound.className = 'wound-mark';
      wound.style.left = displayX + 'px';
      wound.style.top = displayY + 'px';
      gameArea.appendChild(wound);
      currentAttackElements.push(wound);

      // २. रगतका धाराहरू
      const dripCount = Math.floor(Math.random() * 3) + 2; 
      for (let i = 0; i < dripCount; i++) {
        const drip = document.createElement('div');
        drip.className = 'blood-drip';
        const offsetX = (Math.random() - 0.5) * 20; 
        const dripHeight = Math.random() * 80 + 60; 
        
        drip.style.left = (displayX + offsetX) + 'px';
        drip.style.top = displayY + 'px';
        drip.style.setProperty('--drip-height', dripHeight + 'px');
        drip.style.animationDelay = (i * 0.1) + 's';
        gameArea.appendChild(drip);
        currentAttackElements.push(drip);
      }

      // ३. रगतका छिटाहरू
      for (let i = 0; i < 6; i++) {
        const splatter = document.createElement('div');
        splatter.className = 'blood-splatter';
        const size = Math.random() * 6 + 3;
        splatter.style.width = size + 'px';
        splatter.style.height = size + 'px';
        
        const offsetX = (Math.random() - 0.5) * 40;
        const offsetY = (Math.random() - 0.5) * 30;
        
        splatter.style.left = (displayX + offsetX) + 'px';
        splatter.style.top = (displayY + offsetY) + 'px';
        gameArea.appendChild(splatter);
        currentAttackElements.push(splatter);
      }

      // ४. बन्चरो (२६०px मा पनि ठ्याक्कै घाउमा अड्किने गरी)
      const knife = document.createElement('img');
      knife.src = 'knife.png';
      knife.className = 'stuck-knife';
      
      knife.style.setProperty('--hit-x', displayX + 'px');
      knife.style.setProperty('--hit-y', displayY + 'px');
      
      gameArea.appendChild(knife);
      currentAttackElements.push(knife);

      attacks.push({ elements: currentAttackElements });
    });

    resetBtn.addEventListener('click', function() {
      attacks.forEach(attack => {
        attack.elements.forEach(el => el.remove());
      });
      attacks = [];
    });
  </script>

</body>
</html>
