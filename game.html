<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knife Throw Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    /* मुख्य गेम कार्ड */
    .game-card {
      width: 100%;
      max-width: 340px;
      background-color: #1e1e1e;
      border: 2px solid #ff4757;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }

    /* माथि म्यासेज लेख्ने ठाउँ */
    .message-box {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background-color: #2a2a2a;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      color: #ffda79;
      border: 1px dashed #ff4757;
    }

    /* १:१ (Square) फोटो कन्टेनर */
    .game-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1; /* exact 1:1 ratio */
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      background-color: #000;
    }

    /* मुख्य फोटो */
    .target-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* चक्कुको स्टाइल */
    .stuck-knife {
      position: absolute;
      width: 65px;
      height: auto;
      pointer-events: none;
      transform: rotate(-45deg);
      clip-path: polygon(0 0, 100% 0, 100% 55%, 0 55%);
      filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.7));
      z-index: 2;
    }

    /* रगतको छिटा */
    .blood-splatter {
      position: absolute;
      width: 42px;
      height: 42px;
      background: radial-gradient(circle, rgba(190,0,0,1) 0%, rgba(130,0,0,0.85) 55%, transparent 75%);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 3;
    }

    /* रगतका थोपाहरू */
    .blood-drop {
      position: absolute;
      background-color: #8b0000;
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;
    }

    /* तलको रिसिभ / रिसेट बटन */
    .reset-btn {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      background-color: #ff4757;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .reset-btn:active {
      background-color: #ff6b81;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <!-- १. म्यासेज एरिया -->
    <div class="message-box" id="messageArea">
      म्यासेज लेख्न बाँकी छ...
    </div>

    <!-- २. १:१ फोटो र गेम एरिया -->
    <div class="game-container" id="gameArea">
      <img src="238.Png" alt="Target Photo" class="target-img">
    </div>

    <!-- ३. रिसिभ / रिसेट बटन -->
    <button class="reset-btn" id="resetBtn">रिसेट गर्नुहोस् (Receive)</button>
  </div>

  <!-- साउन्ड इफेक्ट -->
  <audio id="hitSound" src="knife-hit.mp3" preload="auto"></audio>

  <script>
    const gameArea = document.getElementById('gameArea');
    const hitSound = document.getElementById('hitSound');
    const resetBtn = document.getElementById('resetBtn');

    // फोटोमा थिच्दा चक्कु र रगत गाडिने
    gameArea.addEventListener('click', function(event) {
      const rect = gameArea.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      hitSound.currentTime = 0;
      hitSound.play().catch(err => console.log("Audio play error:", err));

      // चक्कु थप्ने
      const knife = document.createElement('img');
      knife.src = 'knife.png';
      knife.className = 'stuck-knife knife-item';
      knife.style.left = (x - 22) + 'px';
      knife.style.top = (y - 30) + 'px';
      gameArea.appendChild(knife);

      // रगतको छिटा थप्ने
      const blood = document.createElement('div');
      blood.className = 'blood-splatter blood-item';
      blood.style.left = x + 'px';
      blood.style.top = y + 'px';
      const randomScale = 0.85 + Math.random() * 0.5;
      blood.style.transform = `translate(-50%, -50%) scale(${randomScale})`;
      gameArea.appendChild(blood);

      // रगतका थोपाहरू थप्ने
      for (let i = 0; i < 6; i++) {
        const drop = document.createElement('div');
        drop.className = 'blood-drop blood-item';
        const size = Math.random() * 7 + 3;
        drop.style.width = size + 'px';
        drop.style.height = size + 'px';
        
        const offsetX = (Math.random() - 0.5) * 40;
        const offsetY = (Math.random() - 0.5) * 40;
        
        drop.style.left = (x + offsetX) + 'px';
        drop.style.top = (y + offsetY) + 'px';
        gameArea.appendChild(drop);
      }
    });

    // रिसिभ/रिसेट बटन थिच्दा सबै चक्कु र रगत हटाउने
    resetBtn.addEventListener('click', function() {
      const knives = document.querySelectorAll('.knife-item');
      const bloods = document.querySelectorAll('.blood-item');
      
      knives.forEach(item => item.remove());
      bloods.forEach(item => item.remove());
    });
  </script>

</body>
</html>
