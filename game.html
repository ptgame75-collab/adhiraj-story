<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Axe Throw Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    .game-card {
      width: 100%;
      max-width: 340px;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .message-box {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: #ffda79;
    }

    .game-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      /* रगत फ्रेमबाट बाहिर जाओस् भनेर overflow: visible राखियो */
      overflow: visible; 
      background-color: #000000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
      border-radius: 8px;
    }

    /* २ गुना ठुलो बन्चरो (260px) र धार एलाइनमेन्ट */
    .stuck-knife {
      position: absolute;
      width: 260px;
      height: auto;
      pointer-events: none;
      filter: drop-shadow(6px 10px 12px rgba(0,0,0,0.9));
      z-index: 5; /* बन्चरो घाउ र रगत भन्दा माथि रहनेछ */
      /* transform-origin लाई बन्चरोको धार रहने भाग अनुसार मिलाइएको छ */
      transform-origin: 15% 85%; 
      animation: knifeImpact 0.12s ease-out forwards, knifeShake 0.1s 0.12s ease-in-out;
    }

    @keyframes knifeImpact {
      0% {
        transform: scale(1.5) rotate(-35deg);
        opacity: 0.5;
      }
      100% {
        transform: scale(1) rotate(-35deg);
        opacity: 1;
      }
    }

    @keyframes knifeShake {
      0% { transform: rotate(-35deg) translateY(0); }
      50% { transform: rotate(-32deg) translateY(-3px); }
      100% { transform: rotate(-35deg) translateY(0); }
    }

    /* १. गहिरो घाउ (Cut/Wound Effect) - ठ्याक्कै धार मुनि रहने */
    .wound-mark {
      position: absolute;
      width: 36px;
      height: 8px;
      background: linear-gradient(90deg, #200000 0%, #800000 50%, #200000 100%);
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(0,0,0,0.9), inset 0 0 4px #000;
      z-index: 2;
      animation: woundAppear 0.1s ease-out forwards;
    }

    @keyframes woundAppear {
      0% { transform: translate(-50%, -50%) scale(0.2) rotate(-25deg); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1) rotate(-25deg); opacity: 1; }
    }

    /* २. फ्रेम नाघेर तलसम्म बग्ने रगत (Dripping Blood Outside Frame) */
    .blood-drip {
      position: absolute;
      width: 7px;
      background: linear-gradient(180deg, #8b0000 0%, #600000 60%, #300000 100%);
      border-radius: 4px 4px 6px 6px;
      box-shadow: inset -1px 0 2px rgba(0,0,0,0.6), 0 2px 5px rgba(0,0,0,0.5);
      z-index: 3;
      transform-origin: top center;
      animation: dripFlow 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes dripFlow {
      0% { height: 0px; opacity: 0.95; }
      70% { height: var(--drip-height, 150px); opacity: 0.9; }
      100% { height: var(--drip-height, 150px); opacity: 0.85; }
    }

    /* ३. घाउ नजिकका अर्गानिक छिटाहरू */
    .blood-splatter-dot {
      position: absolute;
      background: radial-gradient(circle, #8b0000 30%, #4a0000 100%);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: dotSpread 0.3s ease-out forwards;
    }

    @keyframes dotSpread {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 0.85; }
    }

    .reset-btn {
      margin-top: 30px; /* रगत बगेर बटनसम्म नछेकिओस् भनेर ग्याप बढाइएको */
      width: 100%;
      padding: 10px;
      background-color: #ff4757;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="message-box" id="messageArea">
      म्यासेज लेख्न बाँकी छ...
    </div>

    <div class="game-container" id="gameArea">
      <canvas id="photoCanvas"></canvas>
    </div>

    <button class="reset-btn" id="resetBtn">रिसेट गर्नुहोस् (Receive)</button>
  </div>

  <audio id="hitSound" src="knife-hit.mp3" preload="auto"></audio>

  <script>
    const canvas = document.getElementById('photoCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const gameArea = document.getElementById('gameArea');
    const hitSound = document.getElementById('hitSound');
    const resetBtn = document.getElementById('resetBtn');

    let attacks = [];
    const MAX_ATTACKS = 3;

    const bgImg = new Image();
    bgImg.src = '238.Png';

    const personImg = new Image();
    personImg.src = '239.Png';

    let imagesLoaded = 0;
    function checkLoaded() {
      imagesLoaded++;
      if (imagesLoaded === 2) {
        canvas.width = bgImg.naturalWidth || 500;
        canvas.height = bgImg.naturalHeight || 500;

        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        ctx.drawImage(personImg, 0, 0, canvas.width, canvas.height);
      }
    }

    bgImg.onload = checkLoaded;
    personImg.onload = checkLoaded;

    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

    personImg.onload = () => {
      offCanvas.width = personImg.naturalWidth;
      offCanvas.height = personImg.naturalHeight;
      offCtx.drawImage(personImg, 0, 0);
      checkLoaded();
    };

    canvas.addEventListener('click', function(event) {
      const rect = canvas.getBoundingClientRect();
      
      const scaleX = offCanvas.width / rect.width;
      const scaleY = offCanvas.height / rect.height;
      
      const canvasX = Math.floor((event.clientX - rect.left) * scaleX);
      const canvasY = Math.floor((event.clientY - rect.top) * scaleY);

      const pixel = offCtx.getImageData(canvasX, canvasY, 1, 1).data;
      const alpha = pixel[3]; 

      if (alpha < 20) {
        return; 
      }

      const displayX = event.clientX - rect.left;
      const displayY = event.clientY - rect.top;

      hitSound.currentTime = 0;
      hitSound.play().catch(err => console.log("Audio play error:", err));

      if (attacks.length >= MAX_ATTACKS) {
        const oldestAttack = attacks.shift();
        oldestAttack.elements.forEach(el => el.remove());
      }

      const currentAttackElements = [];

      // १. घाउको खत (Wound Mark) - ठ्याक्कै क्लिक गरिएको ठाउँमा
      const wound = document.createElement('div');
      wound.className = 'wound-mark';
      wound.style.left = displayX + 'px';
      wound.style.top = displayY + 'px';
      gameArea.appendChild(wound);
      currentAttackElements.push(wound);

      // २. फ्रेम काटेर तलसम्मै बग्ने रगत (Dripping Blood Outside Frame)
      const dripCount = Math.floor(Math.random() * 2) + 2; 
      for (let i = 0; i < dripCount; i++) {
        const drip = document.createElement('div');
        drip.className = 'blood-drip';
        const offsetLeft = (Math.random() - 0.5) * 14;
        
        // फ्रेमभन्दा बाहिर तलसम्म जाने गरी उचाइ (150px - 250px)
        const dripHeight = Math.random() * 100 + 150; 
        
        drip.style.left = (displayX + offsetLeft) + 'px';
        drip.style.top = displayY + 'px';
        drip.style.setProperty('--drip-height', dripHeight + 'px');
        drip.style.animationDelay = (i * 0.12) + 's';
        gameArea.appendChild(drip);
        currentAttackElements.push(drip);
      }

      // ३. घाउ नजिकका अर्गानिक थोपाहरू
      for (let i = 0; i < 5; i++) {
        const dot = document.createElement('div');
        dot.className = 'blood-splatter-dot';
        const size = Math.random() * 6 + 3;
        dot.style.width = size + 'px';
        dot.style.height = size + 'px';
        
        const offsetX = (Math.random() - 0.5) * 20;
        const offsetY = (Math.random() - 0.5) * 20;
        
        dot.style.left = (displayX + offsetX) + 'px';
        dot.style.top = (displayY + offsetY) + 'px';
        dot.style.animationDelay = (Math.random() * 0.15) + 's';
        gameArea.appendChild(dot);
        currentAttackElements.push(dot);
      }

      // ४. बन्चरो (Knife/Axe) - धार ठ्याक्कै घाउ (displayX, displayY) मा मिलाइएको
      const knife = document.createElement('img');
      knife.src = 'knife.png';
      knife.className = 'stuck-knife';
      
      // बन्चरोको धार रहने तल्लो-देब्रे भागलाई (displayX, displayY) मा एलाइन गरिएको
      knife.style.left = (displayX - 35) + 'px'; 
      knife.style.top = (displayY - 220) + 'px'; 
      
      gameArea.appendChild(knife);
      currentAttackElements.push(knife);

      attacks.push({ elements: currentAttackElements });
    });

    resetBtn.addEventListener('click', function() {
      attacks.forEach(attack => {
        attack.elements.forEach(el => el.remove());
      });
      attacks = [];
    });
  </script>

</body>
</html>
