<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अधिराजको खत - गेम</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* १:१ अनुपातमा मिलाइएको गेम कन्टेनर */
        .game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            background-image: url('parbat.png');
            background-size: cover;
            background-position: center;
        }

        /* प्रहार भएपछि देखिने रगतको पारदर्शी प्रभाव (घाउ भएको इफेक्ट) */
        #effect-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('parbat01.png');
            background-size: cover;
            background-position: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
        }

        /* विशेष प्रहार गर्ने लक्षित क्षेत्र (Target Area) */
        #target-zone {
            position: absolute;
            top: 25%;
            left: 25%;
            width: 50%;
            height: 50%;
            cursor: pointer;
        }

        /* प्रहार गरिसकेपछि चक्कु त्यहीं बसिरहने */
        #knife-img {
            position: absolute;
            width: 90px;
            display: none;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameContainer">
        <div id="effect-layer"></div>
        <!-- टार्गेट एरिया, जहाँ क्लिक गर्दा प्रहार हुन्छ -->
        <div id="target-zone"></div>
        <img id="knife-img" src="knife.png" alt="Knife">
    </div>

    <audio id="hitSound" src="khifehit.mp3"></audio>

    <script>
        const targetZone = document.getElementById('target-zone');
        const gameContainer = document.getElementById('gameContainer');
        const effectLayer = document.getElementById('effect-layer');
        const knifeImg = document.getElementById('knife-img');
        const hitSound = document.getElementById('hitSound');

        let hasHit = false; // एक पटक प्रहार भइसकेपछि फेरि नदोहोर्याउनको लागि

        targetZone.addEventListener('click', function(event) {
            if (hasHit) return; // यदि पहिले नै चक्कु प्रहार भइसकेको छ भने रोक्ने
            hasHit = true;

            const containerRect = gameContainer.getBoundingClientRect();
            
            // क्लिक गरेको ठ्याक्कै ठाउँमा चक्कु बस्ने गरी पोजिसन मिलाउने
            const x = event.clientX - containerRect.left;
            const y = event.clientY - containerRect.top;

            knifeImg.style.left = x + 'px';
            knifeImg.style.top = y + 'px';
            knifeImg.style.display = 'block'; // चक्कु देखिने र त्यहीं बस्ने

            // रगत/घाउको इफेक्ट (parbat01.png) देखाउने
            effectLayer.style.opacity = '1';

            // साउन्ड बजाउने
            hitSound.currentTime = 0;
            hitSound.play().catch(e => console.log("Audio error:", e));
        });
    </script>

</body>
</html>
