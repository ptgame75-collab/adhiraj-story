<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Axe Throw Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    .game-card {
      width: 100%;
      max-width: 360px;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .message-box {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      color: #ffda79;
      min-height: 40px;
      transition: all 0.2s ease;
    }

    /* सरी म्यासेज फ्ल्यास हुने एनिमेशन */
    .sorry-flash {
      animation: flashAnim 0.3s ease;
      color: #ff4757 !important;
    }

    @keyframes flashAnim {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .game-container {
      position: relative;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background-color: #000000;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
      border-radius: 8px;
    }

    /* पर्फेक्ट पोजिसन भएको बन्चरोको स्टाइल[span_3](start_span)[span_3](end_span) */
    .stuck-knife {
      position: absolute;
      width: 130px; 
      height: auto;
      pointer-events: none;
      filter: drop-shadow(3px 5px 6px rgba(0, 0, 0, 0.8));
      z-index: 5;
      transform-origin: 0% 50%;
      left: var(--hit-x);
      top: var(--hit-y);
      animation: knifeImpact 0.12s ease-out forwards,
                 knifeShake 0.12s 0.12s ease-in-out;
    }

    @keyframes knifeImpact {
      0% {
        transform: translate(0px, -50%) rotate(-35deg) scale(1.35);
        opacity: 0.5;
      }
      100% {
        transform: translate(0px, -50%) rotate(-35deg) scale(1);
        opacity: 1;
      }
    }

    @keyframes knifeShake {
      0% {
        transform: translate(0px, -50%) rotate(-35deg);
      }
      50% {
        transform: translate(0px, -50%) rotate(-32deg);
      }
      100% {
        transform: translate(0px, -50%) rotate(-35deg);
      }
    }

    /* घाउको स्टाइल[span_4](start_span)[span_4](end_span) */
    .wound-mark {
      position: absolute;
      width: 28px;
      height: 10px;
      background: radial-gradient(ellipse at center, #3a0000 0%, #8b0000 60%, transparent 100%);
      border-radius: 50%;
      box-shadow: inset 0 0 4px #000;
      z-index: 2;
      transform: translate(-50%, -50%) rotate(-20deg);
      animation: woundAppear 0.1s ease-out forwards;
    }

    @keyframes woundAppear {
      0% { transform: translate(-50%, -50%) scale(0.2) rotate(-20deg); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1) rotate(-20deg); opacity: 1; }
    }

    /* भिडियोमा देखाएजस्तो सीधा र गाढा रगतको धारा[span_5](start_span)[span_5](end_span) */
    .blood-drip {
      position: absolute;
      width: 3px;
      background: linear-gradient(to bottom, #8b0000, #4a0000, transparent);
      border-radius: 2px;
      z-index: 3;
      transform-origin: top center;
      animation: dripAnim 2s ease-out forwards;
    }

    @keyframes dripAnim {
      0% { height: 0px; opacity: 1; }
      100% { height: var(--drip-height, 45px); opacity: 0.85; }
    }

    /* रगतका छिटाहरू[span_6](start_span)[span_6](end_span) */
    .blood-splatter {
      position: absolute;
      background-color: #8b0000;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      animation: splatterAnim 0.2s ease-out forwards;
    }

    @keyframes splatterAnim {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 0.9; }
    }

    .reset-btn {
      margin-top: 25px;
      width: 100%;
      padding: 10px;
      background-color: #ff4757;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="message-box" id="messageArea">
      म्यासेज लेख्न बाँकी छ...
    </div>

    <div class="game-container" id="gameArea">
      <canvas id="photoCanvas"></canvas>
    </div>

    <button class="reset-btn" id="resetBtn">रिसेट गर्नुहोस् (Receive)</button>
  </div>

  <audio id="hitSound" src="khifehit.mp3" preload="auto"></audio>

  <script>
    const canvas = document.getElementById('photoCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const gameArea = document.getElementById('gameArea');
    const messageArea = document.getElementById('messageArea');
    const hitSound = document.getElementById('hitSound');
    const resetBtn = document.getElementById('resetBtn');

    let attacks = [];
    const MAX_ATTACKS = 3;

    const bgImg = new Image();
    bgImg.src = 'parbat.png';

    const personImg = new Image();
    personImg.src = 'parbat01.png';

    let imagesLoaded = 0;

    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

    function initGame() {
      const w = bgImg.naturalWidth || 500;
      const h = bgImg.naturalHeight || 500;

      canvas.width = w;
      canvas.height = h;

      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(bgImg, 0, 0, w, h);
      ctx.drawImage(personImg, 0, 0, w, h);

      offCanvas.width = w;
      offCanvas.height = h;
      offCtx.clearRect(0, 0, w, h);
      offCtx.drawImage(personImg, 0, 0, w, h);
    }

    function checkLoaded() {
      imagesLoaded++;
      if (imagesLoaded === 2) {
        initGame();
      }
    }

    bgImg.onload = checkLoaded;
    personImg.onload = checkLoaded;

    canvas.addEventListener('click', function(event) {
      const rect = canvas.getBoundingClientRect();
      
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      
      const canvasX = Math.floor((event.clientX - rect.left) * scaleX);
      const canvasY = Math.floor((event.clientY - rect.top) * scaleY);

      const pixel = offCtx.getImageData(canvasX, canvasY, 1, 1).data;
      const alpha = pixel[3]; 

      if (alpha < 20) {
        return; 
      }

      const displayX = event.clientX - rect.left;
      const displayY = event.clientY - rect.top;

      hitSound.currentTime = 0;
      hitSound.play().catch(err => console.log("Audio play error:", err));

      // म्यासेज बक्समा "सरी सरी सरी!" अपडेट गर्ने[span_7](start_span)[span_7](end_span)
      messageArea.textContent = "सरी सरी सरी!";
      messageArea.classList.remove('sorry-flash');
      void messageArea.offsetWidth;
      messageArea.classList.add('sorry-flash');

      if (attacks.length >= MAX_ATTACKS) {
        const oldestAttack = attacks.shift();
        oldestAttack.elements.forEach(el => el.remove());
      }

      const currentAttackElements = [];

      // १. घाउ[span_8](start_span)[span_8](end_span)
      const wound = document.createElement('div');
      wound.className = 'wound-mark';
      wound.style.left = displayX + 'px';
      wound.style.top = displayY + 'px';
      gameArea.appendChild(wound);
      currentAttackElements.push(wound);

      // २. भिडियोमा देखाएजस्तो सीधा रगतका धाराहरू[span_9](start_span)[span_9](end_span)
      const dripCount = Math.floor(Math.random() * 3) + 2; 
      for (let i = 0; i < dripCount; i++) {
        const drip = document.createElement('div');
        drip.className = 'blood-drip';
        const offsetX = (Math.random() - 0.5) * 12; 
        const dripHeight = Math.random() * 45 + 35; 
        
        drip.style.left = (displayX + offsetX) + 'px';
        drip.style.top = displayY + 'px';
        drip.style.setProperty('--drip-height', dripHeight + 'px');
        drip.style.animationDelay = (i * 0.1) + 's';
        gameArea.appendChild(drip);
        currentAttackElements.push(drip);
      }

      // ३. रगतका छिटाहरू[span_10](start_span)[span_10](end_span)
      for (let i = 0; i < 5; i++) {
        const splatter = document.createElement('div');
        splatter.className = 'blood-splatter';
        const size = Math.random() * 4 + 2;
        splatter.style.width = size + 'px';
        splatter.style.height = size + 'px';
        
        const offsetX = (Math.random() - 0.5) * 25;
        const offsetY = (Math.random() - 0.5) * 15;
        
        splatter.style.left = (displayX + offsetX) + 'px';
        splatter.style.top = (displayY + offsetY) + 'px';
        gameArea.appendChild(splatter);
        currentAttackElements.push(splatter);
      }

      // ४. बन्चरो[span_11](start_span)[span_11](end_span)
      const knife = document.createElement('img');
      knife.src = 'knife.png';
      knife.className = 'stuck-knife';
      
      knife.style.setProperty('--hit-x', displayX + 'px');
      knife.style.setProperty('--hit-y', displayY + 'px');
      
      gameArea.appendChild(knife);
      currentAttackElements.push(knife);

      attacks.push({ elements: currentAttackElements });
    });

    resetBtn.addEventListener('click', function() {
      attacks.forEach(attack => {
        attack.elements.forEach(el => el.remove());
      });
      attacks = [];
      messageArea.textContent = "म्यासेज लेख्न बाँकी छ...";
      messageArea.classList.remove('sorry-flash');
    });
  </script>

</body>
</html>
