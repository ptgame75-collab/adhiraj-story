<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अधिराजको खत - गेम</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* १:१ अनुपातमा मिलाइएको गेम कन्टेनर */
        .game-container {
            position: relative;
            width: 100360px;
            height: 360px;
            max-width: 100%;
            aspect-ratio: 1 / 1;
            background-image: url('parbat.png');
            background-size: cover;
            background-position: center;
        }

        /* प्रहार भएपछि मात्र देखिने पारदर्शी प्रभाव */
        #effect-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('parbat01.png');
            background-size: cover;
            background-position: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease-in-out;
        }

        /* विशेष प्रहार गर्ने लक्षित क्षेत्र (Target Area) - यसमा मात्र क्लिक हुँदा प्रहार हुन्छ */
        #target-zone {
            position: absolute;
            top: 30%;
            left: 30%;
            width: 40%;
            height: 40%;
            cursor: pointer;
        }

        /* चक्कुको ग्राफिक्स */
        #knife-img {
            position: absolute;
            width: 80px;
            display: none;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameContainer">
        <div id="effect-layer"></div>
        <!-- टार्गेट एरिया, जहाँ क्लिक गर्दा मात्र प्रहार हुन्छ -->
        <div id="target-zone"></div>
        <img id="knife-img" src="knife.png" alt="Knife">
    </div>

    <audio id="hitSound" src="khifehit.mp3"></audio>

    <script>
        const targetZone = document.getElementById('target-zone');
        const gameContainer = document.getElementById('gameContainer');
        const effectLayer = document.getElementById('effect-layer');
        const knifeImg = document.getElementById('knife-img');
        const hitSound = document.getElementById('hitSound');

        targetZone.addEventListener('click', function(event) {
            const rect = targetZone.getBoundingClientRect();
            const containerRect = gameContainer.getBoundingClientRect();
            
            // टार्गेटभित्र क्लिक गरेको ठाउँमा चक्कु देखाउने
            const x = event.clientX - containerRect.left;
            const y = event.clientY - containerRect.top;

            knifeImg.style.left = x + 'px';
            knifeImg.style.top = y + 'px';
            knifeImg.style.display = 'block';

            // इफेक्ट र साउन्ड बजाउने
            effectLayer.style.opacity = '1';
            hitSound.currentTime = 0;
            hitSound.play().catch(e => console.log("Audio error:", e));

            // केही समयपछि हटाउने
            setTimeout(() => {
                effectLayer.style.opacity = '0';
                knifeImg.style.display = 'none';
            }, 300);
        });
    </script>

</body>
</html>
