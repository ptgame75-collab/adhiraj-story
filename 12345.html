<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battle Axe Throw Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    .game-card {
      width: 100%;
      max-width: 340px;
      background-color: #1e1e1e;
      border: 2px solid #ff4757;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }

    .message-box {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      background-color: #2a2a2a;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      color: #ffda79;
      border: 1px dashed #ff4757;
    }

    .game-container {
      position: relative;
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background-color: #000;
    }

    canvas {
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
      border-radius: 8px;
    }

    /* बन्चरोको धार ठ्याक्कै क्लिक पोइन्टमा अड्किने गरी मिलाइएको स्टाइल */
    .stuck-knife {
      position: absolute;
      width: 120px;
      height: auto;
      pointer-events: none;
      filter: drop-shadow(3px 5px 8px rgba(0,0,0,0.85));
      z-index: 3;
      
      /* यो लाइनले बन्चरोको धारलाई ठ्याक्कै क्लिक गरेको बिन्दुमा स्थिर राख्छ */
      transform-origin: 0% 50%;
      left: var(--hit-x);
      top: var(--hit-y);

      animation: knifeImpact 0.15s ease-out forwards, knifeShake 0.1s 0.15s ease-in-out;
    }

    @keyframes knifeImpact {
      0% {
        transform: translate(0px, -50%) scale(1.8) rotate(-35deg);
        opacity: 0.5;
      }
      100% {
        transform: translate(0px, -50%) scale(1) rotate(-35deg);
        opacity: 1;
      }
    }

    @keyframes knifeShake {
      0% { transform: translate(0px, -50%) rotate(-35deg); }
      50% { transform: translate(0px, -50%) rotate(-32deg); }
      100% { transform: translate(0px, -50%) rotate(-35deg); }
    }

    /* रगतको छिटा र थोपाहरू */
    .blood-splatter {
      position: absolute;
      width: 48px;
      height: 48px;
      background: radial-gradient(circle, rgba(180,0,0,1) 0%, rgba(110,0,0,0.9) 60%, transparent 80%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }

    .blood-drop {
      position: absolute;
      background-color: #8b0000;
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }

    .reset-btn {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      background-color: #ff4757;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <div class="message-box" id="messageArea">
      म्यासेज लेख्न बाँकी छ...
    </div>

    <div class="game-container" id="gameArea">
      <canvas id="photoCanvas"></canvas>
    </div>

    <button class="reset-btn" id="resetBtn">रिसेट गर्नुहोस् (Receive)</button>
  </div>

  <audio id="hitSound" src="khifehit.mp3" preload="auto"></audio>

  <script>
    const canvas = document.getElementById('photoCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const gameArea = document.getElementById('gameArea');
    const hitSound = document.getElementById('hitSound');
    const resetBtn = document.getElementById('resetBtn');

    let attacks = [];
    const MAX_ATTACKS = 3;

    // सहि गरिएका फाइल नामहरू
    const bgImg = new Image();
    bgImg.src = 'parbat.png';

    const personImg = new Image();
    personImg.src = 'parbat01.png';

    let imagesLoaded = 0;
    function checkLoaded() {
      imagesLoaded++;
      if (imagesLoaded === 2) {
        const w = bgImg.naturalWidth || 500;
        const h = bgImg.naturalHeight || 500;

        canvas.width = w;
        canvas.height = h;

        ctx.drawImage(bgImg, 0, 0, w, h);
        ctx.drawImage(personImg, 0, 0, w, h);
      }
    }

    bgImg.onload = checkLoaded;
    personImg.onload = checkLoaded;

    const offCanvas = document.createElement('canvas');
    const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

    personImg.onload = () => {
      offCanvas.width = personImg.naturalWidth;
      offCanvas.height = personImg.naturalHeight;
      offCtx.drawImage(personImg, 0, 0);
      checkLoaded();
    };

    canvas.addEventListener('click', function(event) {
      const rect = canvas.getBoundingClientRect();
      
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      
      const canvasX = Math.floor((event.clientX - rect.left) * scaleX);
      const canvasY = Math.floor((event.clientY - rect.top) * scaleY);

      const pixel = offCtx.getImageData(canvasX, canvasY, 1, 1).data;
      const alpha = pixel[3]; 

      if (alpha < 20) {
        return; 
      }

      const displayX = event.clientX - rect.left;
      const displayY = event.clientY - rect.top;

      hitSound.currentTime = 0;
      hitSound.play().catch(err => console.log("Audio play error:", err));

      if (attacks.length >= MAX_ATTACKS) {
        const oldestAttack = attacks.shift();
        oldestAttack.elements.forEach(el => el.remove());
      }

      const currentAttackElements = [];

      // १. बन्चरो सहि पोजिसनमा राख्ने
      const knife = document.createElement('img');
      knife.src = 'knife.png';
      knife.className = 'stuck-knife knife-item';
      knife.style.setProperty('--hit-x', displayX + 'px');
      knife.style.setProperty('--hit-y', displayY + 'px');
      gameArea.appendChild(knife);
      currentAttackElements.push(knife);

      // २. रगतको छिटा
      const blood = document.createElement('div');
      blood.className = 'blood-splatter blood-item';
      blood.style.left = displayX + 'px';
      blood.style.top = displayY + 'px';
      const randomScale = 0.9 + Math.random() * 0.5;
      blood.style.transform = `translate(-50%, -50%) scale(${randomScale})`;
      gameArea.appendChild(blood);
      currentAttackElements.push(blood);

      // ३. रगतका थोपाहरू
      for (let i = 0; i < 6; i++) {
        const drop = document.createElement('div');
        drop.className = 'blood-drop blood-item';
        const size = Math.random() * 8 + 4;
        drop.style.width = size + 'px';
        drop.style.height = size + 'px';
        
        const offsetX = (Math.random() - 0.5) * 45;
        const offsetY = (Math.random() - 0.5) * 45;
        
        drop.style.left = (displayX + offsetX) + 'px';
        drop.style.top = (displayY + offsetY) + 'px';
        gameArea.appendChild(drop);
        currentAttackElements.push(drop);
      }

      attacks.push({ elements: currentAttackElements });
    });

    resetBtn.addEventListener('click', function() {
      attacks.attacks = [];
      document.querySelectorAll('.knife-item').forEach(item => item.remove());
      document.querySelectorAll('.blood-item').forEach(item => item.remove());
    });
  </script>

</body>
</html>
