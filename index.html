<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>अधिराजको खत</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="अधिराजको खत">
    <link rel="apple-touch-icon" href="a.0063.jpg">

    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Georgia', serif; }
        
        #bgVideo { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            filter: brightness(0.8); 
            opacity: 0; 
            animation: fadeInBg 2s forwards; 
            z-index: 1;
        }

        @keyframes fadeInBg { to { opacity: 1; } }

        #introContainer { 
            position: relative; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 10; 
            padding: 20px; 
            text-align: center; 
        }

        .progress-bar { 
            width: 70%; 
            max-width: 250px; 
            height: 3px; 
            background: rgba(255,255,255,0.2); 
            border-radius: 10px; 
            /* 'g' अक्षरलाई नछोओस् भनेर ४५px मा थोरै तल सारिएको छ */
            margin-top: 45px; 
            overflow: hidden; 
        }

        .progress-fill { 
            width: 0%; 
            height: 100%; 
            background: #d32f2f; 
            transition: width 4.9s linear; 
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- ब्याकग्राउन्ड भिडियो -->
    <video autoplay muted loop playsinline id="bgVideo">
        <source src="a.0063.mp4" type="video/mp4">
    </video>

    <div id="introContainer">
        <div class="progress-bar">
            <div id="pFill" class="progress-fill"></div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.getRegistrations().then(regs => {
                    let unregisterPromises = regs.map(reg => reg.unregister());
                    return Promise.all(unregisterPromises);
                }).then(() => {
                    return navigator.serviceWorker.register('sw.js');
                }).then(() => console.log('SW Registered'))
                .catch(err => console.log('SW Registration process error:', err));
            });
        }

        const fill = document.getElementById('pFill');

        window.onload = () => {
            if (sessionStorage.getItem('appLoaded')) {
                window.location.replace("home.html");
                return;
            }
            sessionStorage.setItem('appLoaded', 'true');

            setTimeout(() => {
                fill.style.width = '100%';
            }, 500);

            setTimeout(() => {
                document.body.style.transition = 'opacity 0.5s ease';
                document.body.style.opacity = '0';
                setTimeout(() => {
                    window.location.replace("home.html");
                }, 500);
            }, 4900);
        };
    </script>
</body>
</html>
